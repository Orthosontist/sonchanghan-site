name: Sync Naver blog articles
on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/sync_blog.py
      - scripts/rebuild_site.py
      - scripts/site_pages.py
      - journal/ai-readable.css
      - .github/workflows/sync-blog.yml
permissions:
  contents: write
concurrency:
  group: naver-blog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/sync_blog.py
      - run: python scripts/rebuild_site.py
      - name: Commit updated articles
        run: |
          git add index.html doctor consultation cases journal sitemap.xml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Sync public Naver blog articles'
            git push
          fi
